const OFFICIAL=GEO;
let timer=null;
function norm(v=''){return String(v).normalize('NFKC').toLowerCase().replace(/\s+/g,'').replace(/^道の駅/,'');}
function esc(v=''){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));}
function setStatus(msg,ms=0){
  const el=document.getElementById('status');
  if(!el)return;
  el.textContent=msg; el.classList.remove('hidden');
  if(ms)setTimeout(()=>el.classList.add('hidden'),ms);
}
function popup(s){
  const q=encodeURIComponent(`道の駅 ${s.name} ${s.pref} ${s.loc||''}`);
  const note=s.approx?'<div class="popup-reg">※位置は概略です</div>':'';
  return `<div class="popup-name">${esc(s.name)}</div><div class="popup-meta">${esc(s.pref)} ${esc(s.loc||'')}</div><div class="popup-reg">${esc(s.reg||'')} ${esc(s.date||'')}</div>${note}<div class="popup-actions"><a class="popup-link map" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">地図で見る</a>${s.url?`<a class="popup-link web" href="${esc(s.url)}" target="_blank" rel="noopener">公式情報</a>`:''}</div>`;
}
function render(q=''){
  if(!window.__stationLayer||!window.__stationMap)return;
  const layer=window.__stationLayer, map=window.__stationMap;
  layer.clearLayers();
  const key=norm(q);
  const shown=key?GEO.filter(s=>norm(`${s.name}${s.pref}${s.loc||''}`).includes(key)):GEO;
  const bounds=[];
  shown.forEach(s=>{
    const lat=Number(s.lat), lon=Number(s.lon);
    if(!Number.isFinite(lat)||!Number.isFinite(lon))return;
    L.circleMarker([lat,lon],{
      renderer:window.__stationRenderer,
      radius:s.approx?4.2:4.8,
      weight:1.5,
      color:'#f8f1d8',
      fillColor:s.approx?'#6e8f5f':'#285b3b',
      fillOpacity:.95
    }).bindPopup(popup(s)).addTo(layer);
    bounds.push([lat,lon]);
  });
  const badge=document.getElementById('countBadge');
  if(badge)badge.textContent=key?`${shown.length}駅表示`:`国交省 ${GEO.length.toLocaleString('ja-JP')}駅`;
  if(key&&bounds.length)map.fitBounds(bounds,{padding:[28,28],maxZoom:11});
}
(()=>{
const map=L.map('map',{zoomControl:true,minZoom:4,maxZoom:18,preferCanvas:true}).setView([37.1,137.2],5);
const renderer=L.canvas({padding:.5});
window.__stationMap=map; window.__stationRenderer=renderer;
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const layer=L.layerGroup().addTo(map); window.__stationLayer=layer; const badge=document.getElementById('countBadge'),status=document.getElementById('status'),notice=document.getElementById('notice'),search=document.getElementById('searchInput');
const geo=GEO;
const byName=new Map();
GEO.forEach((s,i)=>{s.id=s.id||i+1;const k=norm(s.name);if(!byName.has(k))byName.set(k,[]);byName.get(k).push(s)});
render();
setStatus(`国交省1,231駅をアプリ内データから表示中`,2200);
notice.style.display='none';
search.addEventListener('input',e=>{clearTimeout(timer);timer=setTimeout(()=>render(e.target.value),170)});
document.getElementById('locateBtn').addEventListener('click',()=>{if(!navigator.geolocation)return setStatus('現在地を取得できません',1800);setStatus('現在地を探しています…');navigator.geolocation.getCurrentPosition(p=>{const a=[p.coords.latitude,p.coords.longitude];L.circleMarker(a,{radius:9,weight:3,color:'#315d3c',fillColor:'#fffdf8',fillOpacity:1}).addTo(map).bindPopup('📍 現在地').openPopup();map.setView(a,10);setStatus('現在地へ移動しました',1400)},()=>setStatus('現在地を取得できませんでした',1800),{enableHighAccuracy:true,timeout:10000})});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
