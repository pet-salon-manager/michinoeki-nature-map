(()=>{
const map=L.map('map',{zoomControl:true,minZoom:4,maxZoom:18}).setView([37.1,137.2],5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const layer=L.layerGroup().addTo(map),badge=document.getElementById('countBadge'),status=document.getElementById('status'),notice=document.getElementById('notice'),search=document.getElementById('searchInput');
let geo=[],timer; const norm=s=>(s||'').replace(/^道の駅\s*/,'').replace(/[\s　・･]/g,'').toLowerCase();
const byName=new Map();OFFICIAL.forEach((s,i)=>{s.id=i;const k=norm(s.name);if(!byName.has(k))byName.set(k,[]);byName.get(k).push(s)});
function esc(s=''){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function setStatus(t,ms=0){status.textContent=t;status.classList.remove('hidden');if(ms)setTimeout(()=>status.classList.add('hidden'),ms)}
function icon(){return L.divIcon({className:'',html:'<div class="station-pin"></div>',iconSize:[20,20],iconAnchor:[10,18],popupAnchor:[0,-16]})}
function popup(s){const place=`${s.pref} ${s.loc}`;const q=encodeURIComponent(`道の駅 ${s.name} ${place}`);return `<div class="popup-eyebrow">🌿 ${esc(s.pref)}の道の駅</div><div class="popup-name">${esc(s.name)}</div><div class="popup-meta">${esc(place)}</div><div class="popup-reg">${esc(s.reg)}登録 ・ ${esc(s.date)}</div><div class="popup-actions"><a class="popup-link map" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">地図で見る</a>${s.url?`<a class="popup-link web" href="${esc(s.url)}" target="_blank" rel="noopener">公式情報</a>`:''}</div>`}
function render(q=''){layer.clearLayers();const key=norm(q);let shown=key?geo.filter(s=>norm(s.name+s.pref+s.loc).includes(key)):geo;const bounds=[];shown.forEach(s=>{L.marker([s.lat,s.lon],{icon:icon(),title:s.name}).bindPopup(popup(s)).addTo(layer);bounds.push([s.lat,s.lon])});badge.textContent=key?`${shown.length}駅表示`:'国交省 1,231駅';if(key&&bounds.length)map.fitBounds(bounds,{padding:[28,28],maxZoom:11})}
async function loadGeo(){const eps=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];const query='[out:json][timeout:90];area["ISO3166-1"="JP"][admin_level=2]->.jp;(nwr["name"~"^道の駅"](area.jp);nwr["name:ja"~"^道の駅"](area.jp););out center tags;';let err;for(const ep of eps){try{const r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:'data='+encodeURIComponent(query)});if(!r.ok)throw Error(r.status);const d=await r.json();const used=new Set();for(const el of d.elements||[]){const lat=el.lat??el.center?.lat,lon=el.lon??el.center?.lon;if(!Number.isFinite(lat)||!Number.isFinite(lon))continue;const raw=el.tags?.['name:ja']||el.tags?.name||'';const candidates=byName.get(norm(raw))||[];for(const s of candidates){if(!used.has(s.id)){geo.push({...s,lat,lon});used.add(s.id);break}}}if(geo.length<100)throw Error('few');return}catch(e){err=e}}throw err}
loadGeo().then(()=>{render();setStatus(`国交省1,231駅のうち、地図位置 ${geo.length}駅を表示`,2600);if(geo.length<OFFICIAL.length){notice.style.display='block';notice.textContent=`国交省マスタは1,231駅です。地図上の位置はOpenStreetMapの登録名と照合できた${geo.length}駅を表示しています。`;setTimeout(()=>notice.style.display='none',6500)}}).catch(()=>{status.classList.add('hidden');notice.style.display='block';notice.textContent='国交省の1,231駅マスタは読み込まれていますが、地図位置の取得に失敗しました。通信状態を確認して再読み込みしてください。'});
